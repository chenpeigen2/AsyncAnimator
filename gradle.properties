# gradle.properties — synced to D:\CLauncher\TclLauncher
android.useAndroidX=true
android.enableJetifier=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Larger heap matches TclLauncher (lib + demo both 1.5G+ at full build)
org.gradle.jvmargs=-Xmx6g -Xss4m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
android.nonFinalResIds=true
android.r8.maxWorkers=4
# org.gradle.user.home=D\:\\.gradle

# Suppress AGP warning about compileSdk > 35 (using 37 here)
android.suppressUnsupportedCompileSdk=37

kotlin.code.style=official

# 避免 Gradle toolchain 自动探测选中 VS Code redhat JRE（无 jlink 导致 JdkImageTransform 失败）。
# 本仓库未声明另一 toolchain；用 gradlew --version 核对实际 JVM，不能把此开关视为强制 JDK 版本。
# 环境预检及本机 SDK 兼容目录边界见 docs/build-environment.md。
org.gradle.java.installations.auto-detect=false