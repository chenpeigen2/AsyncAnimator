# gradle.properties — synced to D:\CLauncher\TclLauncher
android.useAndroidX=true
android.enableJetifier=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Larger heap matches TclLauncher (lib + demo both 1.5G+ at full build)
org.gradle.jvmargs=-Xmx6g -Xss4m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
android.nonFinalResIds=true
android.r8.maxWorkers=4
# org.gradle.user.home=D\:\\.gradle

# Suppress AGP warning about compileSdk > 35 (using 37 here)
android.suppressUnsupportedCompileSdk=37

kotlin.code.style=official