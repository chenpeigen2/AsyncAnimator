// demo/build.gradle — synced to D:\CLauncher\TclLauncher app module style
plugins {
    alias libs.plugins.android.application
    alias libs.plugins.kotlin.android
}

android {
    namespace 'com.asyncanimator.demo'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId 'com.asyncanimator.demo'
        minSdk 36
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        viewBinding true
    }
}

// 与 lib 共用同一套由 Gradle 解析的 Robolectric Android SDK，避免测试运行时再次下载。
def robolectricSdkConfiguration = configurations.create('robolectricSdk')
tasks.register('prepareRobolectricSdk', Sync) {
    from robolectricSdkConfiguration
    into layout.buildDirectory.dir('robolectric-sdk')
}
tasks.withType(Test).configureEach {
    dependsOn tasks.named('prepareRobolectricSdk')
    systemProperty 'robolectric.usePreinstrumentedJars', 'false'
    systemProperty 'robolectric.dependency.dir',
        layout.buildDirectory.dir('robolectric-sdk').get().asFile.absolutePath
}

dependencies {
    testImplementation libs.junit
    testImplementation libs.robolectric
    testRuntimeOnly libs.robolectric.android
    add('robolectricSdk', libs.robolectric.android)
    implementation project(':lib')
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.recyclerview
    implementation libs.google.material
    implementation libs.androidx.constraintlayout
}
